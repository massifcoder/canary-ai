services:
  - type: web
    name: canary-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: SANDBOX_API_BASE
        value: "https://api-m.sandbox.paypal.com"
      - key: SANDBOX_EMAIL
        sync: false
      - key: SANDBOX_EMAIL_PASSWORD
        sync: false
      - key: BUSINESS_DISPLAY_APP_NAME
        value: "Canary"
      - key: BUSINESS_CLIENT_ID
        sync: false
      - key: BUSINESS_SECRET_KEY
        sync: false
      - key: SANDBOX_BUSINESS_EMAIL
        sync: false
      - key: SANDBOX_BUSINESS_EMAIL_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ONKERNEL_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false

  - type: web
    name: canary-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
      - key: NEXT_PUBLIC_API_URL
        value: "https://canary-backend.onrender.com"
